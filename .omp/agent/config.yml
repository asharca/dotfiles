modelRoles:
  web: web/exa:auto
  advisor: rhzy-gpt/gpt-6-astra:high
  plan: rhzy-gpt/gpt-6-astra:auto
  commit: rhzy-gpt/gpt-6-luna:low
  slow: rhzy-gpt/gpt-6-astra:auto
  smol: rhzy-gpt/gpt-6.1-terra:auto
  vision: rhzy-gpt/gpt-6-astra:low
  task: rhzy-gpt/gpt-6.1-sol:auto
  memory: rhzy-gpt/gpt-6.1-sol:auto
  tiny: rhzy-gpt/gpt-6-luna:low
  judge: rhzy-gpt/gpt-6-astra
  default: rhzy-gpt/gpt-6.1-sol
  image: openai/gpt-image-2.5-sunburst
  frontend: rhzy-gpt/gpt-6-astra:auto
  backend: rhzy-gpt/gpt-6.1-sol:auto
retry:
  enabled: true
  modelFallback: false
  maxRetries: 3
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains: {}
task:
  prewalk: false
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: rhzy-gpt/gpt-6-luna:low
    reviewer: rhzy-gpt/gpt-6-astra:high
    security-reviewer: rhzy-gpt/gpt-6-astra:high
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 3
dev:
  autoqaConsent: granted
defaultThinkingLevel: auto
browser:
  relay: true
compaction:
  enabled: true
generate_image:
  enabled: true
display:
  showTokenUsage: true
  cacheMissMarker: true
statusLine:
  rightSegments:
    - session_name
    - git
    - pr
  preset: custom
  segmentOptions:
    path:
      maxLength: 24
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - path
    - context_pct
    - cache_hit
    - cache_read
    - token_total
    - cost
update:
  auto: true